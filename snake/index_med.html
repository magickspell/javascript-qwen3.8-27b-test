<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Змейка</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #1a1a2e;
        font-family: Arial, sans-serif;
        color: #fff;
    }

    h1 {
        margin-bottom: 10px;
        color: #4ecca3;
    }

    .score {
        font-size: 20px;
        margin-bottom: 10px;
    }

    #game {
        background: #16213e;
        border: 3px solid #4ecca3;
        border-radius: 8px;
    }

    .controls {
        margin-top: 15px;
        font-size: 14px;
        color: #aaa;
    }

    #gameOver {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        padding: 40px 60px;
        border-radius: 10px;
        text-align: center;
        display: none;
        border: 2px solid #4ecca3;
    }

    #gameOver button {
        margin-top: 20px;
        padding: 10px 25px;
        font-size: 16px;
        background: #4ecca3;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    #gameOver button:hover {
        background: #3db892;
    }
</style>
</head>
<body>

<h1>Змейка</h1>
<div class="score">Счёт: <span id="score">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<div class="controls">Управление: стрелки / WASD</div>

<div id="gameOver">
    <h2>Игра окончена!</h2>
    <p>Твой счёт: <span id="finalScore">0</span></p>
    <button onclick="restart()">Играть снова</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');

const gridSize = 20;                       // размер клетки
const tileCount = canvas.width / gridSize; // количество клеток

let snake, food, dx, dy, score, gameLoop, speed;

function init() {
    snake = [{ x: 10, y: 10 }];
    dx = 0;
    dy = 0;
    score = 0;
    speed = 150;
    scoreEl.textContent = score;
    placeFood();
}

function placeFood() {
    food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };
    // Еда не должна появиться на змейке
    if (snake.some(seg => seg.x === food.x && seg.y === food.y)) {
        placeFood();
    }
}

function draw() {
    // Фон
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Еда
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2, 0, Math.PI * 2
    );
    ctx.fill();

    // Змейка
    snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#4ecca3' : '#38b390';
        ctx.fillRect(
            seg.x * gridSize + 1,
            seg.y * gridSize + 1,
            gridSize - 2,
            gridSize - 2
        );
    });
}

function update() {
    if (dx === 0 && dy === 0) return; // игра ещё не началась

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // Столкновение со стеной
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame();
        return;
    }

    // Столкновение с собой
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
    }

    snake.unshift(head);

    // Съели еду
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();

        // Ускоряемся
        if (speed > 60) {
            speed -= 3;
            clearInterval(gameLoop);
            gameLoop = setInterval(tick, speed);
        }
    } else {
        snake.pop();
    }
}

function tick() {
    update();
    draw();
}

function endGame() {
    clearInterval(gameLoop);
    finalScoreEl.textContent = score;
    gameOverEl.style.display = 'block';
}

function restart() {
    gameOverEl.style.display = 'none';
    init();
    draw();
    startGame();
}

function startGame() {
    clearInterval(gameLoop);
    gameLoop = setInterval(tick, speed);
}

document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    // Не даём разворачиваться на 180 градусов
    if ((key === 'arrowup' || key === 'w') && dy !== 1) { dx = 0; dy = -1; startGame(); }
    else if ((key === 'arrowdown' || key === 's') && dy !== -1) { dx = 0; dy = 1; startGame(); }
    else if ((key === 'arrowleft' || key === 'a') && dx !== 1) { dx = -1; dy = 0; startGame(); }
    else if ((key === 'arrowright' || key === 'd') && dx !== -1) { dx = 1; dy = 0; startGame(); }
});

// Старт
init();
draw();
</script>

</body>
</html>
