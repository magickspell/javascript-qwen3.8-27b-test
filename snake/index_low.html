<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-board {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .score-board span {
            color: #00d2ff;
            font-weight: bold;
        }

        #gameCanvas {
            border: 3px solid #3a7bd5;
            border-radius: 8px;
            background: #16213e;
            box-shadow: 0 0 30px rgba(58, 123, 213, 0.3);
        }

        .controls {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        .game-over-overlay {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            width: 100%;
            height: 100%;
        }

        .game-over-overlay h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #ff4757;
        }

        .game-over-overlay p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .game-over-overlay button {
            padding: 12px 30px;
            font-size: 1.1rem;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-over-overlay button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
        }

        .container {
            position: relative;
        }
    </style>
</head>
<body>
    <h1>🐍 Змейка</h1>
    <div class="score-board">
        <div>Счёт: <span id="score">0</span></div>
        <div>Рекорд: <span id="highScore">0</span></div>
    </div>
    <div class="container">
        <canvas id="gameCanvas"></canvas>
        <div class="game-over-overlay" id="gameOverOverlay">
            <h2>Игра окончена!</h2>
            <p>Ваш счёт: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Играть снова</button>
        </div>
    </div>
    <div class="controls">Управление: ← ↑ → ↓ или WASD</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverOverlay = document.getElementById('gameOverOverlay');

        const GRID_SIZE = 20;
        const COLS = 25;
        const ROWS = 25;

        canvas.width = COLS * GRID_SIZE;
        canvas.height = ROWS * GRID_SIZE;

        let snake, direction, nextDirection, food, score, highScore, gameLoop, speed, isAlive;

        highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        highScoreEl.textContent = highScore;

        function init() {
            snake = [
                { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = 150;
            isAlive = true;
            scoreEl.textContent = '0';
            gameOverOverlay.style.display = 'none';
            placeFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        function placeFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
            } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
            food = newFood;
        }

        function update() {
            if (!isAlive) return;

            direction = { ...nextDirection };

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Проверка столкновений со стенами
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                endGame();
                return;
            }

            // Проверка столкновений с собой
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Поела
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;

                // Увеличение скорости
                if (speed > 60) {
                    speed -= 3;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, speed);
                }

                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Фон
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Сетка (лёгкая)
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // Еда
            const foodX = food.x * GRID_SIZE + GRID_SIZE / 2;
            const foodY = food.y * GRID_SIZE + GRID_SIZE / 2;
            ctx.beginPath();
            ctx.arc(foodX, foodY, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4757';
            ctx.fill();
            // Свечение еды
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Змейка
            snake.forEach((seg, i) => {
                const x = seg.x * GRID_SIZE;
                const y = seg.y * GRID_SIZE;

                if (i === 0) {
                    // Голова
                    ctx.fillStyle = '#00d2ff';
                    ctx.shadowColor = '#00d2ff';
                    ctx.shadowBlur = 10;
                } else {
                    // Тело с градиентом
                    const alpha = 1 - (i / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(58, 123, 213, ${alpha})`;
                    ctx.shadowBlur = 0;
                }

                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Глаза на голове
            const head = snake[0];
            const hx = head.x * GRID_SIZE;
            const hy = head.y * GRID_SIZE;
            ctx.fillStyle = '#fff';
            const eyeSize = 4;
            const offset = 5;

            if (direction.x === 1) {
                ctx.beginPath(); ctx.arc(hx + GRID_SIZE - offset - 2, hy + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(hx + GRID_SIZE - offset - 2, hy + GRID_SIZE - 6, eyeSize, 0, Math.PI * 2); ctx.fill();
            } else if (direction.x === -1) {
                ctx.beginPath(); ctx.arc(hx + offset + 2, hy + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(hx + offset + 2, hy + GRID_SIZE - 6, eyeSize, 0, Math.PI * 2); ctx.fill();
            } else if (direction.y === -1) {
                ctx.beginPath(); ctx.arc(hx + 6, hy + offset + 2, eyeSize, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(hx + GRID_SIZE - 6, hy + offset + 2, eyeSize, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.beginPath(); ctx.arc(hx + 6, hy + GRID_SIZE - offset - 2, eyeSize, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(hx + GRID_SIZE - 6, hy + GRID_SIZE - offset - 2, eyeSize, 0, Math.PI * 2); ctx.fill();
            }
        }

        function endGame() {
            isAlive = false;
            clearInterval(gameLoop);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }

            finalScoreEl.textContent = score;
            gameOverOverlay.style.display = 'flex';
        }

        function restartGame() {
            init();
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
                e.preventDefault();
            }

            if ((key === 'ArrowUp' || key === 'w') && direction.y !== 1) {
                nextDirection = { x: 0, y: -1 };
            } else if ((key === 'ArrowDown' || key === 's') && direction.y !== -1) {
                nextDirection = { x: 0, y: 1 };
            } else if ((key === 'ArrowLeft' || key === 'a') && direction.x !== 1) {
                nextDirection = { x: -1, y: 0 };
            } else if ((key === 'ArrowRight' || key === 'd') && direction.x !== -1) {
                nextDirection = { x: 1, y: 0 };
            }
        });

        // Запуск
        init();
    </script>
</body>
</html>
